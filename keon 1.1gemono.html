<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Keon Controller PWA</title>
    <!-- Chargement de la bibliothèque Buttplug.io -->
    <script src="https://cdn.jsdelivr.net/npm/buttplug@3.2.0/dist/web/buttplug.min.js"></script>
    <style>
        :root {
            --bg-color: #121212;
            --pad-bg: #2a2a2a;
            --accent: #ff4757;
            --text: #ffffff;
        }
        body {
            margin: 0; padding: 0; background: var(--bg-color); color: var(--text);
            font-family: sans-serif; display: flex; flex-direction: column;
            align-items: center; height: 100vh; touch-action: none; /* Empêche le scroll sur mobile */
        }
        header { padding: 15px; text-align: center; }
        #status { color: #2ed573; font-size: 0.9em; margin-top: 5px; }
        
        /* Zone du Joystick */
        #pad-container {
            width: 90vw; max-width: 400px; height: 50vh;
            background: var(--pad-bg); border-radius: 15px;
            position: relative; margin: 20px 0;
            border: 2px solid #333; overflow: hidden;
        }
        #cursor {
            width: 40px; height: 40px; background: var(--accent);
            border-radius: 50%; position: absolute;
            left: 50%; top: 50%; transform: translate(-50%, -50%);
            pointer-events: none; opacity: 0.5; transition: opacity 0.2s;
        }
        #pad-container.active #cursor { opacity: 1; box-shadow: 0 0 15px var(--accent); }
        
        /* Boutons d'action */
        .controls { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        button {
            background: #333; color: white; border: none;
            padding: 15px 25px; border-radius: 8px; font-size: 1rem;
            cursor: pointer; text-transform: uppercase; font-weight: bold;
        }
        button:active { background: #555; }
        #btn-connect { background: #1e90ff; width: 90vw; max-width: 400px; margin-bottom: 10px; }
        #btn-record.recording { background: #ff4757; animation: pulse 1s infinite; }
        #btn-play.playing { background: #2ed573; }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        
        /* Affichage des valeurs en direct */
        #debug { margin-top: 20px; font-family: monospace; color: #aaa; }
    </style>
</head>
<body>

    <header>
        <h2>Keon Control Pad</h2>
        <div id="status">Déconnecté</div>
    </header>

    <button id="btn-connect">1. Connecter l'appareil Bluetooth</button>

    <div id="pad-container">
        <div id="cursor"></div>
    </div>

    <div class="controls">
        <button id="btn-record">Enregistrer (REC)</button>
        <button id="btn-play" disabled>Lecture (PLAY)</button>
        <button id="btn-stop">STOP</button>
    </div>

    <div id="debug">Vitesse: 0% | Hauteur: 0%</div>

    <script>
        // --- VARIABLES D'ÉTAT ---
        let keonDevice = null;
        let isOscillating = false;
        
        // Paramètres actuels (0 à 1)
        let currentSpeed = 0; 
        let currentDepth = 0; 

        // Enregistrement
        let isRecording = false;
        let isPlaying = false;
        let recordStartTime = 0;
        let recordedPattern = []; // Stockera des objets { time, speed, depth }
        let playTimeouts = [];

        // DOM Elements
        const pad = document.getElementById('pad-container');
        const cursor = document.getElementById('cursor');
        const debug = document.getElementById('debug');
        const btnConnect = document.getElementById('btn-connect');
        const btnRecord = document.getElementById('btn-record');
        const btnPlay = document.getElementById('btn-play');
        const btnStop = document.getElementById('btn-stop');
        const statusEl = document.getElementById('status');

        // --- 1. GESTION DU BLUETOOTH (BUTTPLUG.IO) ---
        btnConnect.addEventListener('click', async () => {
            try {
                statusEl.innerText = "Initialisation...";
                await Buttplug.buttplugInit();
                
                const client = new Buttplug.ButtplugClient("Keon PWA");
                
                client.addListener("deviceadded", async (device) => {
                    if (device.messageAttributes.includes("LinearCmd")) {
                        keonDevice = device;
                        statusEl.innerText = `Connecté : ${device.name}`;
                        btnConnect.style.display = 'none'; // Cacher le bouton une fois connecté
                        startOscillationLoop(); // Lancer la boucle de mouvement
                    } else {
                        statusEl.innerText = "Appareil incompatible trouvé.";
                    }
                });

                client.addListener("deviceremoved", () => {
                    keonDevice = null;
                    statusEl.innerText = "Appareil déconnecté.";
                    isOscillating = false;
                });

                // Ouvre la popup native du navigateur pour choisir le Keon
                await client.connect(new Buttplug.ButtplugEmbeddedClientConnector());
                await client.startScanning();
                statusEl.innerText = "Sélectionnez le Keon...";

            } catch (e) {
                statusEl.innerText = "Erreur : " + e.message;
            }
        });

        // --- 2. LOGIQUE DU MOTEUR (TRADUCTION X/Y VERS LINEAR) ---
        // Le Keon fonctionne avec des commandes de position. 
        // Il faut lui dire d'aller en haut, puis en bas, en boucle.
        async function startOscillationLoop() {
            if (isOscillating || !keonDevice) return;
            isOscillating = true;
            
            let position = 0; // 0 = rentré, 1 = sorti

            while (isOscillating) {
                if (currentSpeed > 0.05 && currentDepth > 0.05) { // Seuil mort pour éviter le bruit
                    // Calcul du temps de trajet (durée) en fonction de la vitesse (X)
                    // Plus X est grand, plus le temps est court.
                    // Max lent : 1500ms, Max rapide : 150ms
                    const durationMs = 1500 - (currentSpeed * 1350); 
                    
                    // La cible dépend de l'amplitude (Y).
                    // Si position est 0, on va vers 'currentDepth'. Si 1, on retourne à 0.
                    const targetPosition = position === 0 ? currentDepth : 0;

                    try {
                        await keonDevice.linear(targetPosition, durationMs);
                        await sleep(durationMs); // Attendre que le mouvement se termine
                        position = position === 0 ? 1 : 0; // Inverser pour le prochain coup
                    } catch (e) {
                        console.error("Erreur de commande", e);
                        await sleep(500);
                    }
                } else {
                    // Si le joystick est relâché (ou proche de zéro), on attend
                    await sleep(100);
                }
            }
        }
        const sleep = ms => new Promise(res => setTimeout(res, ms));

        // --- 3. GESTION DU JOYSTICK TACTILE ---
        function updatePad(event) {
            if(isPlaying) return; // Bloquer le joystick manuel pendant la lecture

            const rect = pad.getBoundingClientRect();
            let x = event.clientX - rect.left;
            let y = event.clientY - rect.top;

            // Contraindre dans la boîte
            x = Math.max(0, Math.min(x, rect.width));
            y = Math.max(0, Math.min(y, rect.height));

            // Placement visuel du curseur
            cursor.style.left = x + 'px';
            cursor.style.top = y + 'px';

            // Conversion en pourcentages (0.0 à 1.0)
            // X = Vitesse (gauche à droite)
            // Y = Profondeur (bas vers le haut, on inverse l'axe Y)
            let rawSpeed = x / rect.width;
            let rawDepth = 1 - (y / rect.height);

            setKeonValues(rawSpeed, rawDepth);

            // Enregistrement si actif
            if (isRecording) {
                recordedPattern.push({
                    time: Date.now() - recordStartTime,
                    speed: currentSpeed,
                    depth: currentDepth
                });
            }
        }

        function setKeonValues(speed, depth) {
            currentSpeed = speed;
            currentDepth = depth;
            debug.innerText = `Vitesse: ${Math.round(currentSpeed*100)}% | Hauteur: ${Math.round(currentDepth*100)}%`;
        }

        // Événements tactiles et souris
        pad.addEventListener('pointerdown', (e) => {
            if(isPlaying) return;
            pad.classList.add('active');
            pad.setPointerCapture(e.pointerId);
            updatePad(e);
        });
        pad.addEventListener('pointermove', (e) => {
            if (pad.classList.contains('active')) updatePad(e);
        });
        pad.addEventListener('pointerup', (e) => {
            pad.classList.remove('active');
            pad.releasePointerCapture(e.pointerId);
            // Remettre à zéro (Homme mort) - commenter la ligne ci-dessous si on veut que ça continue
            setKeonValues(0, 0); 
            
            // Revenir au centre visuellement
            cursor.style.left = '50%'; cursor.style.top = '50%';
            
            if (isRecording) {
                recordedPattern.push({ time: Date.now() - recordStartTime, speed: 0, depth: 0 });
            }
        });

        // --- 4. ENREGISTREMENT ET LECTURE ---
        btnRecord.addEventListener('click', () => {
            if (isPlaying) stopPlayback();
            
            if (!isRecording) {
                isRecording = true;
                recordedPattern = [];
                recordStartTime = Date.now();
                btnRecord.classList.add('recording');
                btnRecord.innerText = "Arrêter REC";
                btnPlay.disabled = true;
                // Enregistrer l'état initial (0,0)
                recordedPattern.push({ time: 0, speed: 0, depth: 0 });
            } else {
                isRecording = false;
                btnRecord.classList.remove('recording');
                btnRecord.innerText = "Enregistrer (REC)";
                if (recordedPattern.length > 1) btnPlay.disabled = false;
            }
        });

        btnPlay.addEventListener('click', () => {
            if (isRecording || recordedPattern.length === 0) return;
            
            isPlaying = true;
            btnPlay.classList.add('playing');
            btnPlay.innerText = "Lecture en cours...";
            
            // Programmer tous les changements d'état
            recordedPattern.forEach(point => {
                let timeout = setTimeout(() => {
                    setKeonValues(point.speed, point.depth);
                    // Animation visuelle basique du curseur pendant la lecture
                    const rect = pad.getBoundingClientRect();
                    cursor.style.left = (point.speed * rect.width) + 'px';
                    cursor.style.top = ((1 - point.depth) * rect.height) + 'px';
                }, point.time);
                playTimeouts.push(timeout);
            });

            // Fin de la lecture
            let lastEventTime = recordedPattern[recordedPattern.length - 1].time;
            setTimeout(stopPlayback, lastEventTime + 100);
        });

        function stopPlayback() {
            playTimeouts.forEach(clearTimeout);
            playTimeouts = [];
            isPlaying = false;
            btnPlay.classList.remove('playing');
            btnPlay.innerText = "Lecture (PLAY)";
            setKeonValues(0, 0);
            cursor.style.left = '50%'; cursor.style.top = '50%';
        }

        btnStop.addEventListener('click', () => {
            if (isRecording) btnRecord.click();
            if (isPlaying) stopPlayback();
            setKeonValues(0, 0);
        });

    </script>
</body>
</html>
